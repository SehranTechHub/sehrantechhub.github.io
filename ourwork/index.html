    <style>
        .image-container {
            cursor: pointer;
            position: relative;
        }

        .overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.6);
            /* Semi-transparent overlay */
            display: none;
            /* justify-content: center; */
            align-items: center;
            flex-direction: column;
            animation: fadeIn 0.8s;
        }

        @keyframes fadeIn {
            0% {
                opacity: 0;
            }

            100% {
                opacity: 1;
            }
        }

        .overlay .container {
            height: 100%;
            padding: 20px;
        }

        .overlay-header {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 10%;
        }

        .overlay-header h2 {
            color: white;
            font-weight: bold;
        }

        .overlay-content {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 90%;
            flex-direction: column;
            gap: 10px;
        }

        .overlay-content a {
            width: 50%;
        }

        .image-wrapper {
            position: relative;
            width: 100%;
            overflow: hidden;
            cursor: pointer;
            /* Keeps the overlay within the bounds of the container */
        }

        .image-wrapper img {
            width: 100%;
            height: auto;
            transition: transform 0.5s ease;
            /* Smooth scaling transition */
        }

        .image-wrapper .image-title {
            position: absolute;
            top: 50%;
            /* Center vertically */
            left: 50%;
            /* Center horizontally */
            transform: translate(-50%, -50%);
            color: white;
            font-size: 20px;
            /* Adjust to your needs */
            opacity: 0;
            transition: opacity 0.5s ease;
            /* Smooth transition for opacity */
            pointer-events: none;
            /* Avoids interference with mouse events */
        }

        .image-wrapper::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0);
            /* Initially transparent */
            transition: background-color 0.5s ease;
            /* Smooth transition for background color */
        }

        .image-wrapper:hover::before {
            background-color: rgba(0, 0, 0, 0.7);
            /* Dark overlay on hover */
        }

        .image-wrapper:hover .image-title {
            opacity: 1;
            /* Show the title on hover */
        }

        .custom-modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.8);
            z-index: 1000;
            align-items: center;
            justify-content: center;
        }

        .custom-modal-content {
            position: relative;
            width: 100%;
            height: 100%;
            background: transparent;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .custom-modal-content iframe {
            width: 100%;
            height: 100%;
            border: none;
        }

        .custom-close-button {
            position: absolute;
            top: 10px;
            right: 20px;
            /* background: #ff5f5f; */
            border: none;
            color: white;
            /* padding: 10px; */
            /* border-radius: 50%; */
            cursor: pointer;
            font-size: 30px;
            font-weight: bolder;
            z-index: 1100;
        }

        /* .custom-close-button:hover {
            background: #ff3f3f;
        } */

        @media (max-width: 768px) {
            .custom-close-button {
                font-size: 30px;
                padding: 8px;
            }

            /* Mobile screen size */
            .col-md-4 {
                padding-top: 12px;
                padding-bottom: 12px;
            }

            .row {
                padding-top: 0 !important;
                padding-bottom: 0 !important;
            }
        }

    document.addEventListener("DOMContentLoaded", function () {
        const portfolioContainer = document.getElementById('portfolio');

        // Helper function to group data into chunks of size n
        const chunkArray = (arr, chunkSize) => {
            const result = [];
            for (let i = 0; i < arr.length; i += chunkSize) {
                result.push(arr.slice(i, i + chunkSize));
            }
            return result;
        };

        // Group data into chunks of 3
        const rows = chunkArray(data, 3);

        const rowDiv = document.createElement('div');
        rowDiv.className = 'row';

        rows.forEach(rowItems => {
            // Create a new row div
            const rowDiv = document.createElement('div');
            rowDiv.className = 'row';
            rowDiv.style.paddingBottom = '12px';
            rowDiv.style.paddingTop = '12px';

            rowItems.forEach(item => {
                // Create the col-md-4 div
                const colDiv = document.createElement('div');
                colDiv.className = 'col-md-4';
                colDiv.innerHTML = `
                <div class="image-wrapper">
                    <img src="${item.imgSrc}" alt="${item.title}">
                    <div class="image-title">${item.title}</div>
                </div>
            `;

                // Add click event for the modal
                colDiv.addEventListener('click', function () {
                    const modal = document.getElementById('video-modal');
                    document.getElementById('iframebody').innerHTML = item.iframe;
                    modal.style.display = 'flex';
                });

                // Append the colDiv to the rowDiv
                rowDiv.appendChild(colDiv);
            });

            // Append the rowDiv to the portfolioContainer
            portfolioContainer.appendChild(rowDiv);
        });

    });

    const closeButton = document.getElementById('close-modal');
    const modal = document.getElementById('video-modal');
    // Close modal
    closeButton.addEventListener('click', () => {
        const iframeBody = document.getElementById('iframebody');
        iframeBody.innerHTML = ''; // Clear the iframe content
        modal.style.display = 'none';
    });


    function showOverlay(event, idString) {
        const [id, ignore] = idString.split("_");
        if (isMobileDevice()) {
            const overlay = document.getElementById(id);
            const computedStyle = window.getComputedStyle(overlay);

            if (computedStyle.display === 'flex') {
                overlay.style.display = 'none';
            } else {
                overlay.style.display = 'flex';
            }
        } else {
        }
    }

    // Function to add padding to col-md-4 on smaller screens
    const updatePadding = () => {
        const cols = document.querySelectorAll('.col-md-4');
        cols.forEach(col => {
            if (window.innerWidth <= 768) {
                col.style.paddingTop = '12px';
                col.style.paddingBottom = '12px';
            } else {
                col.style.paddingTop = '';
                col.style.paddingBottom = '';
            }
        });
    };

    // Call updatePadding on load and on resize
    updatePadding();
    window.addEventListener('resize', updatePadding);

    function showCategories(idString) {
        const [id, ignore] = idString.split("_");
        const overlay = document.getElementById(id);
        overlay.style.display = 'flex';
    }

    function hideCategories(idString) {
        const [id, ignore] = idString.split("_");
        const overlay = document.getElementById(id);
        overlay.style.display = 'none';
    }

    function isMobileDevice() {
        return window.innerWidth <= 768;
    }
