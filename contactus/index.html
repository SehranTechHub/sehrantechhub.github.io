<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description"
        content="Professional photography and studio services. Explore our portfolio and connect with us for your next project.">
    <meta name="keywords"
        content="photography, studio, photographer, photo services, thatstudio, studio malaysia, wearethatstudio">
    <meta name="author" content="thatstudio.my">
    <meta name="robots" content="index, follow">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <link rel="apple-touch-icon" sizes="180x180" href="../img/favicon/apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="32x32" href="../img/favicon/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="../img/favicon/favicon-16x16.png">
    <link rel="manifest" href="../img/favicon/site.webmanifest">
    <link rel="icon" type="image/x-icon" href="../img/favicon/favicon.ico">
    <title>thatstudio | Video Production House, Malaysia</title>
    <!-- <link rel="stylesheet" href="style.css"> -->
    <link href="../styles/bootstrap.min.css" rel="stylesheet">
    <link href="../styles/common.css" rel="stylesheet">
    <style>
        body,
        html {
            height: 100%;
            margin: 0;
        }

        .contact-container {
            max-width: 600px;
            margin: 50px auto;
            padding: 20px;
            background: #ffffff;
            border: 1px solid #000000;
            border-radius: 8px;
        }

        .contact-container h1 {
            text-align: center;
            color: #000000;
            margin-bottom: 20px;
            font-family: Arial, sans-serif;
        }

        .contact-container p {
            text-align: center;
            margin-bottom: 30px;
            color: #000000;
        }

        .contact-container form {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .contact-container label {
            font-size: 14px;
            color: #000000;
        }

        .contact-container input,
        .contact-container textarea {
            width: 100%;
            padding: 10px;
            border: 1px solid #000000;
            border-radius: 5px;
            font-size: 14px;
            box-sizing: border-box;
            background-color: #ffffff;
            color: #000000;
        }

        .contact-container textarea {
            resize: none;
            height: 100px;
        }

        .contact-container button {
            background-color: #000000;
            color: #ffffff;
            padding: 10px;
            font-size: 16px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            transition: background-color 0.3s ease, color 0.3s ease;
        }

        .contact-container button:hover {
            background-color: #ffffff;
            color: #000000;
            border: 1px solid #000000;
        }

        .contact-details {
            margin-top: 20px;
            text-align: center;
            color: #000000;
        }

        .contact-details p {
            margin: 5px 0;
        }

        .contact-details a {
            color: #000000;
            text-decoration: none;
        }

        .contact-details a:hover {
            text-decoration: underline;
        }

        @media (max-width: 768px) {
            .contact-container {
                margin-top: 10px;
                margin-bottom: 10px;
                margin-right: 20px;
                margin-left: 20px;
                padding: 15px;
            }

            .contact-container h1 {
                font-size: 20px;
                margin-bottom: 10px;
            }

            .contact-container p {
                font-size: 14px;
                margin-bottom: 10px;
            }

            .contact-container button {
                font-size: 14px;
                padding: 8px;
            }
        }
    </style>
</head>

<body>
    <!-- HEADER NAVBAR -->
    <div class="container-fluid navbar-container" style="padding-left: 24px; padding-right: 24px;">
        <nav class="navbar navbar-expand-lg navbar-padding">
            <a class="navbar-brand" href="/">
                <img class="header-logo" src="../img/wearethatstudioregularlogo.png" height="20" width="auto">
            </a>
            <div class="navbar-toggler" style="border: none; padding-right: 0;" data-bs-toggle="offcanvas"
                data-bs-target="#offcanvasRight" aria-controls="offcanvasRight">
                <span class="navbar-toggler-icon"></span>
            </div>
            <div class="collapse navbar-collapse" id="navbarSupportedContent">
                <ul class="navbar-nav ms-auto mb-2 mb-lg-0" style="gap: 30px">
                    <li class="nav-item">
                        <a class="nav-link" href="/ourwork">OUR WORKS</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="https://www.instagram.com/wearethatstudio/"
                            target="_blank">SOCIALS</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="/aboutus/">ABOUT US</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link active" href="/contactus">CONTACT US</a>
                    </li>
                </ul>
            </div>
        </nav>

        <!-- OFFCANVAS MENU -->
        <div class="offcanvas offcanvas-end" tabindex="-1" id="offcanvasRight" aria-labelledby="offcanvasRightLabel">
            <div class="offcanvas-header">
                <button type="button" class="btn-close" data-bs-dismiss="offcanvas" aria-label="Close"></button>
            </div>
            <div class="offcanvas-body">
                <div class="text-center mb-4">
                    <a href="/ourwork">
                        <h4 class="offcanvas-h4">OUR WORK</h4>
                    </a>
                </div>
                <div class="text-center mb-4">
                    <a href="https://www.instagram.com/wearethatstudio/" target="_blank">
                        <h4 class="offcanvas-h4">SOCIALS</h4>
                    </a>
                </div>
                <div class="text-center mb-4">
                    <a href="/aboutus">
                        <h4 class="offcanvas-h4">ABOUT US</h4>
                    </a>
                </div>
                <div class="text-center mb-4">
                    <a href="/contactus">
                        <h4 class="offcanvas-h4">CONTACT US</h4>
                    </a>
                </div>

            </div>
        </div>
    </div>

    <div class="contact-container">
        <h1>Contact Us</h1>
        <p>We would love to hear from you. Please fill out the form below:</p>
        <form id="contactForm">
            <label for="name">Name</label>
            <input type="text" id="name" name="name" placeholder="Your name" required>

            <label for="email">Email</label>
            <input type="email" id="email" name="email" placeholder="Your email" required>

            <label for="message">Message</label>
            <textarea id="message" name="message" rows="3" placeholder="Your message" required></textarea>

            <button type="submit">Send Message</button>
        </form>

        <div class="contact-details">
            <p>Follow us on Instagram: <a href="https://www.instagram.com/wearethatstudio"
                    target="_blank">@wearethatstudio</a>
            </p>
            <p>Email us at: <a href="mailto:wearethatstudio@gmail.com">wearethatstudio@gmail.com</a></p>
        </div>
    </div>


    <script src="../js/bootstrap.min.js"></script>

    <script>

        const contactForm = document.getElementById("contactForm");

        contactForm.addEventListener("submit", (e) => {
            e.preventDefault();

            let name = document.getElementById("name").value;
            let email = document.getElementById("email").value;
            let message = document.getElementById("message").value;

            var mailtoLink = "mailto:wearethatstudio@gmail.com?subject=Contact from website&body=Name:%20" + encodeURIComponent(name) + "%0D%0AEmail:%20" + encodeURIComponent(email) + "%0D%0AMessage:%20" + encodeURIComponent(message);
            window.location.href = mailtoLink;
        })

    </script>

</body>

</html>
