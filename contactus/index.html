    <div class="container-fluid" id="contact-container" style="margin-top: 150px;">
        <div class="row">
            <div id="send-email" class="col-md-6 d-flex justify-content-end"
                style="border-right: 1px solid #aaaaaa;padding-right: 30px;">
                <form id="contactForm" style="width: 70%;">
                    <div class="mb-3">
                        <label for="name" class="form-label">Name *</label>
                        <input type="text" class="form-control" id="name" placeholder="Your Name" required>
                    </div>
                    <div class="mb-3">
                        <label for="email" class="form-label">Email address *</label>
                        <input type="email" class="form-control" id="email" placeholder="Email Address" required>
                    </div>
                    <div class="mb-3">
                        <label for="message" class="form-label">Message *</label>
                        <textarea class="form-control" id="message" rows="3" placeholder="Your Message..."
                            required></textarea>
                    </div>

                    <div style="display: flex;justify-content: center; align-items: center;">
                        <button type="submit" class="btn btn-dark">Submit</button>
                    </div>
                </form>
            </div>
            <div id="contact-info" class="col-md-6"
                style="display: flex; justify-content: center;flex-direction: column;padding-left: 30px;">
                <div class="mb-4">
                    <a href="https://www.instagram.com/wearethatstudio/" target="_blank" class="text-decoration-none"
                        style="color: black;">
                        <img src="https://cdn.jsdelivr.net/npm/bootstrap-icons/icons/instagram.svg" alt="Instagram"
                            width="30" height="30" />
                        <span class="">: @wearethatstudio</span>
                    </a>
                </div>
                <!-- Email Section -->
                <div class="">
                    <a href="mailto:wearethatstudio@gmail.com" class="text-decoration-none" style="color: black;">
                        <img src="https://cdn.jsdelivr.net/npm/bootstrap-icons/icons/envelope.svg" alt="Email"
                            width="30" height="30" />
                        <span class="">: wearethatstudio@gmail.com</span>
                    </a>
                </div>
            </div>
        </div>
    </div>

    <script src="../js/bootstrap.min.js"></script>

    <script>

        const contactForm = document.getElementById("contactForm");

        contactForm.addEventListener("submit", (e) => {
            e.preventDefault();

            let name = document.getElementById("name").value;
            let email = document.getElementById("email").value;
            let message = document.getElementById("message").value;

            var mailtoLink = "mailto:wearethatstudio@gmail.com?subject=Contact from website&body=Name:%20" + encodeURIComponent(name) + "%0D%0AEmail:%20" + encodeURIComponent(email) + "%0D%0AMessage:%20" + encodeURIComponent(message);
            window.location.href = mailtoLink;
        })

    </script>
