<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description"
        content="Professional photography and studio services. Explore our portfolio and connect with us for your next project.">
    <meta name="keywords"
        content="photography, studio, photographer, photo services, thatstudio, studio malaysia, wearethatstudio">
    <meta name="author" content="thatstudio.my">
    <meta name="robots" content="index, follow">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <link rel="apple-touch-icon" sizes="180x180" href="img/favicon/apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="32x32" href="img/favicon/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="img/favicon/favicon-16x16.png">
    <link rel="manifest" href="img/favicon/site.webmanifest">
    <link rel="icon" type="image/x-icon" href="img/favicon/favicon.ico">
    <title>thatstudio | Video Production House, Malaysia</title>
    <link href="styles/bootstrap.min.css" rel="stylesheet">
    <link href="styles/common.css" rel="stylesheet">
    <style>
        body,
        html {
            height: 100%;
            margin: 0;
            overflow: hidden;
        }

        .container-fluid {
            padding-left: 24px;
            padding-right: 24px;
        }

        nav.navbar {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 10;
            background-color: white;
            /* box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1); */
            padding-left: 24px;
            padding-right: 24px;
        }

        .video-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            overflow: hidden;
        }

        #video-bg {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            opacity: 0;
            /* Initially hidden */
            transition: opacity 1.5s ease-in-out;
            /* Smooth fade-in */
        }

        .video-description {
            position: absolute;
            top: 50%;
            left: 2%;
            /* left: 50%; */
            /* transform: translate(-50%, -50%); */
            z-index: 2;
            color: white;
            text-align: left;
            text-shadow: 0 2px 5px rgba(0, 0, 0, 0.5);
        }
        @media (max-width: 768px) {
            .video-description h3 {
                font-size: 14px;
            }
        }

        /* .video-description h1 {
            font-size: 3rem;
            margin: 0;
        } */
    </style>
</head>

<body>
    <!-- HEADER NAVBAR -->
    <div class="container-fluid navbar-container" style="padding-left: 24px; padding-right: 24px;">
        <nav class="navbar navbar-expand-lg navbar-padding">
            <a class="navbar-brand" href="/">
                <img class="header-logo" src="img/wearethatstudioregularlogo.png" height="20" width="auto">
            </a>
            <div class="navbar-toggler" style="border: none; padding-right: 0;" data-bs-toggle="offcanvas"
                data-bs-target="#offcanvasRight" aria-controls="offcanvasRight">
                <span class="navbar-toggler-icon"></span>
            </div>
            <div class="collapse navbar-collapse" id="navbarSupportedContent">
                <ul class="navbar-nav ms-auto mb-2 mb-lg-0" style="gap: 30px">
                    <li class="nav-item">
                        <a class="nav-link" href="/ourwork">OUR WORKS</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="https://www.instagram.com/wearethatstudio/"
                            target="_blank">SOCIALS</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="/aboutus/">ABOUT US</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="/contactus">CONTACT US</a>
                    </li>
                </ul>
            </div>
        </nav>

        <!-- OFFCANVAS MENU -->
        <div class="offcanvas offcanvas-end" tabindex="-1" id="offcanvasRight" aria-labelledby="offcanvasRightLabel">
            <div class="offcanvas-header">
                <button type="button" class="btn-close" data-bs-dismiss="offcanvas" aria-label="Close"></button>
            </div>
            <div class="offcanvas-body">
                <div class="text-center mb-4">
                    <a href="/ourwork">
                        <h4 class="offcanvas-h4">OUR WORK</h4>
                    </a>
                </div>
                <div class="text-center mb-4">
                    <a href="https://www.instagram.com/wearethatstudio/" target="_blank">
                        <h4 class="offcanvas-h4">SOCIALS</h4>
                    </a>
                </div>
                <div class="text-center mb-4">
                    <a href="/aboutus">
                        <h4 class="offcanvas-h4">ABOUT US</h4>
                    </a>
                </div>
                <div class="text-center mb-4">
                    <a href="/contactus">
                        <h4 class="offcanvas-h4">CONTACT US</h4>
                    </a>
                </div>

            </div>
        </div>
    </div>

    <div class="video-container">
        <video autoplay muted loop id="video-bg" onloadeddata="this.style.opacity = 1;" playsinline>
            <source src="https://storage.googleapis.com/thatstudio/WEBSITE%20LANDING%20PAGE%20LOOP.mp4"
                type="video/mp4">
            Your browser does not support the video tag.
        </video>
        <div class="video-description">
            <h3>We are a Malaysian based production house specializing</h3>
            <h3>in creating high-quality visual content that tells your story.</h3>
            <h3>We are that studio.</h1>
        </div>
    </div>

    <script src="js/bootstrap.min.js"></script>
</body>

</html>
