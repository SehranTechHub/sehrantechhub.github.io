<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <link rel="icon" type="image/x-icon" href="img/favicon.ico">
    <title>thatstudio</title>
    <link href="styles/bootstrap.min.css" rel="stylesheet">
    <link href="styles/common.css" rel="stylesheet">
    <style>
        body,
        html {
            height: 100%;
            margin: 0;
            overflow: hidden;
        }

        .container-fluid {
            padding-left: 24px;
            padding-right: 24px;
        }

        nav.navbar {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 10;
            background-color: white;
            /* box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1); */
            padding-left: 24px;
            padding-right: 24px;
        }

        .video-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            overflow: hidden;
        }

        #video-bg {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            opacity: 0; /* Initially hidden */
            transition: opacity 1.5s ease-in-out; /* Smooth fade-in */
        }

        .video-description {
            position: absolute;
            top: 50%;
            left: 2%;
            /* left: 50%; */
            /* transform: translate(-50%, -50%); */
            z-index: 2;
            color: white;
            text-align: left;
            text-shadow: 0 2px 5px rgba(0, 0, 0, 0.5);
        }

        /* .video-description h1 {
            font-size: 3rem;
            margin: 0;
        } */
    </style>
</head>

<body>
    <div class="container-fluid" style="padding-left: 24px;padding-right: 24px;">
        <nav class="navbar navbar-expand-lg">
            <a class="navbar-brand" href="/">
                <img src="img/header_logo.jpg" height="50" width="auto">
            </a>
            <div class="navbar-toggler" style="border: none;padding-right: 0;" data-bs-toggle="offcanvas"
                data-bs-target="#offcanvasRight" aria-controls="offcanvasRight">
                <span class="navbar-toggler-icon"></span>
            </div>

            <div class="collapse navbar-collapse" id="navbarSupportedContent">
                <ul class="navbar-nav ms-auto mb-2 mb-lg-0" style="gap: 30px">

                    <li class="nav-item">
                        <a class="nav-link" aria-current="page" href="/ourwork">OUR WORKS</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" aria-current="page" href="https://www.instagram.com/wearethatstudio/"
                            target="_blank">SOCIALS</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" aria-current="page" href="/contactus">CONTACT US</a>
                    </li>
                </ul>
            </div>
        </nav>

        <div class="offcanvas offcanvas-end" tabindex="-1" id="offcanvasRight" aria-labelledby="offcanvasRightLabel">
            <div class="offcanvas-header">
                <button type="button" class="btn-close" data-bs-dismiss="offcanvas" aria-label="Close"></button>
            </div>
            <div class="offcanvas-body">
                <div class="text-center mb-4">
                    <a href="/ourwork">
                        <h4 class="offcanvas-h4">OUR WORK</h4>
                    </a>
                </div>
                <div class="text-center mb-4">
                    <a href="https://www.instagram.com/wearethatstudio/" target="_blank">
                        <h4 class="offcanvas-h4">SOCIALS</h4>
                    </a>
                </div>
                <div class="text-center mb-4">
                    <a href="/contactus">
                        <h4 class="offcanvas-h4">CONTACT US</h4>
                    </a>
                </div>
            </div>
        </div>
    </div>

    <div class="video-container">
        <video autoplay muted loop id="video-bg" onloadeddata="this.style.opacity = 1;">
            <source src="https://storage.googleapis.com/thatstudio/WEBSITE%20LANDING%20PAGE%20LOOP.mp4" type="video/mp4">
            Your browser does not support the video tag.
        </video>
        <div class="video-description">
            <h3>We are Malaysian based production house specializing</h3>
            <h3>in creating high-quality visual content that tells you story.</h3>
            <h3>We are that studio.</h1>
        </div>
    </div>

    <script src="js/bootstrap.min.js"></script>
</body>

</html>
